<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Week</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>This week</h1>
      <button id="new-week" class="link">New week</button>
    </header>

    <ol id="days"></ol>

    <section id="library">
      <h2>Saved workouts</h2>
      <ul id="saved"></ul>
      <form id="add-saved">
        <input id="saved-name" placeholder="New workout, e.g. Lower body" required>
        <button>Save</button>
      </form>
    </section>
  </main>

  <template id="day-tpl">
    <li class="day">
      <div class="day-head">
        <input type="checkbox" class="done" aria-label="Done">
        <span class="day-name"></span>
        <input class="summary" placeholder="Rest / plan…">
      </div>
      <ul class="workouts"></ul>
      <select class="picker">
        <option value="">+ Add workout</option>
      </select>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
